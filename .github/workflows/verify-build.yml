name: Verify Build (no signing)

# Compile-check the stripped wfb-ng-free build without a keystore.
# Triggers:
#   - push to strip-wfb-ng (or any branch you point at)
#   - manual workflow_dispatch (pick any branch that contains this file)
on:
  push:
    branches:
      - 'strip-wfb-ng'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "ndk;26.1.10909125"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK (unsigned)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelPilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
